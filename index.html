<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>下一站，未知｜旅行盲選</title><style>
:root{font-family:system-ui,-apple-system,'Noto Sans TC',sans-serif;color:#f6f1e8;background:#091324}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 15%,#213b5b 0,transparent 40%),radial-gradient(circle at 85% 80%,#392944 0,transparent 45%),#091324}main{max-width:980px;margin:auto;padding:24px 18px 70px}.top{display:flex;justify-content:space-between;align-items:center;letter-spacing:.16em;font-size:12px;color:#c6bcae}.logo{color:#f7c985;font-weight:800}.panel{margin:38px auto 0;border:1px solid #ffffff2b;border-radius:28px;padding:clamp(22px,5vw,52px);background:#101c30d9;box-shadow:0 22px 80px #0005;min-height:540px}.eyebrow{color:#f6c98a;letter-spacing:.22em;font-size:12px;font-weight:700;text-transform:uppercase}h1{font-size:clamp(32px,5vw,56px);margin:12px 0;line-height:1.22}h2{font-size:clamp(26px,4vw,40px);margin:10px 0}.sub{color:#c2cbd7;line-height:1.8}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:14px 22px;font-weight:750;transition:.18s}button:hover{transform:translateY(-2px)}.primary{background:#f6c985;color:#152033}.ghost{background:#ffffff15;color:white;border:1px solid #ffffff30}.progress{display:flex;gap:8px;margin:22px 0}.progress i{height:5px;flex:1;border-radius:9px;background:#ffffff26}.progress i.on{background:#f6c985}.venn{position:relative;width:min(100%,560px);height:340px;margin:25px auto 10px}.circle{position:absolute;width:225px;height:225px;border-radius:50%;border:2px solid #ffffff55;display:grid;place-items:start center;padding-top:48px;font-size:19px;font-weight:800;pointer-events:none}.c1{left:70px;top:8px;background:#46b99555}.c2{right:70px;top:8px;background:#65aee655}.c3{left:calc(50% - 112.5px);top:105px;background:#f4b35a55}.hit{position:absolute;z-index:3;background:#0a1826d9;border:1px solid #fff8;color:#fff;border-radius:50px;padding:12px 15px;font-size:13px;box-shadow:0 8px 30px #0007;white-space:nowrap}.hit:hover{background:#f6c985;color:#162035}.h12{top:88px;left:50%;transform:translateX(-50%)}.h13{top:185px;left:25%;transform:translateX(-50%)}.h23{top:185px;left:75%;transform:translateX(-50%)}.h12:hover,.h13:hover,.h23:hover{transform:translateX(-50%) translateY(-2px)}.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin:28px 0}.choice{background:linear-gradient(140deg,#273c53,#15253a);border:1px solid #ffffff33;border-radius:20px;text-align:left;color:white;min-height:150px;padding:24px}.choice strong{display:block;font-size:21px;margin:12px 0}.choice small{color:#c7d0dc;line-height:1.6}.tag{display:inline-block;background:#ffffff18;padding:6px 10px;border-radius:30px;font-size:12px;color:#f6c985}.reveal{border:1px solid #f6c98577;border-radius:22px;background:linear-gradient(135deg,#293b53,#151f31);padding:30px;margin:26px 0}.reveal h2{color:#ffd996;font-size:clamp(34px,5vw,55px)}.pill{display:inline-block;background:#f6c98524;border:1px solid #f6c98570;border-radius:30px;padding:7px 12px;margin:4px;font-size:13px}.signature{margin-top:26px;text-align:center;font-size:11px;letter-spacing:.06em;color:#b7a889;opacity:.82}.foot{font-size:12px;color:#9aaabd;margin-top:25px;line-height:1.7}@media(max-width:600px){.panel{margin-top:22px;min-height:490px}.venn{height:290px;transform:scale(.82);transform-origin:top center;margin-bottom:-30px}.circle{width:210px;height:210px}.c1{left:0}.c2{right:0}.c3{left:calc(50% - 105px);top:95px}.h12{top:85px}.h13,.h23{top:170px}.h13{left:23%}.h23{left:77%}.hit{font-size:12px;padding:10px}.top{letter-spacing:.06em}}
</style></head><body><main><header class="top"><span class="logo">✦ UNKNOWN DESTINATION</span><span>14—15 NOV 2026 · TWO PLAYERS</span></header><section class="panel" id="app" aria-live="polite"></section><footer class="signature">Crafted with curiosity by John, H.T.C. © 2026</footer></main><script>
const places={jiaoxi:{name:'礁溪＋頭城',emoji:'🌅',tags:['溫泉小旅行','外澳海岸','山海探索'],desc:'山海與溫泉一次收藏。週六傍晚抵達後可以放鬆，週日再探索頭城海岸。'},beitou:{name:'北投＋陽明山',emoji:'🌋',tags:['溫泉','草原山景','絹絲瀑布'],desc:'溫泉與山林地熱交織，適合喜歡山景、步道與瀑布的旅人。'},wulai:{name:'烏來',emoji:'🌿',tags:['森林瀑布','溫泉','山中老街'],desc:'山谷、瀑布與森林氣息，適合想遠離城市、慢慢散步的旅人。'},keelung:{name:'基隆＋八斗子',emoji:'🚃',tags:['深澳鐵道自行車','海岸步道','港城美食'],desc:'特別的海景鐵道騎乘與東北角海岸景觀，充滿冒險感。'},jiufen:{name:'九份＋金瓜石',emoji:'🏮',tags:['山城','茶壺山','海景'],desc:'走進山海交會的礦業山城，登高賞海景，再感受夜晚小鎮氛圍。'},jinshan:{name:'金山＋萬里',emoji:'🪨',tags:['奇岩海岸','濱海步道','溫泉'],desc:'奇岩海岸與溫泉兼具，適合喜歡地質景觀和輕健行的旅人。'},tamsui:{name:'淡水＋八里',emoji:'🚴',tags:['河岸單車','觀音山','河口風景'],desc:'沿著河岸騎車、看山與夕陽，交通輕鬆，節奏自由。'}};
let stage='start',path='',chosen=[],candidates=[];const app=document.getElementById('app');
const first={ms:['jiaoxi','keelung','jiufen','jinshan','tamsui'],mh:['jiaoxi','beitou','wulai','jinshan'],sh:['jiaoxi','jinshan']};
const questions={ms:{labels:['🚴 單車漫遊','⛰️ 景觀登山','🏮 小鎮探索'],maps:{'01':['tamsui','jiaoxi'],'02':['keelung','jiaoxi','tamsui'],'12':['jiufen','jiaoxi']}},mh:{labels:['⛰️ 景觀登山','🌲 森林瀑布','🍵 老街美食'],maps:{'01':['beitou','wulai'],'02':['jiaoxi','beitou'],'12':['wulai','jiaoxi']}}};
// Explicitly authored preference-based shortlists. No forced one-to-one assignment.
const finalChoice={ms:{'01':['tamsui','jiaoxi'],'02':['keelung','tamsui','jiaoxi'],'12':['jiufen','jiaoxi']},mh:{'01':['beitou','wulai'],'02':['jiaoxi','beitou'],'12':['wulai','jiaoxi']}};
function shell(step,body){app.innerHTML=`<div class="eyebrow">${step}</div><div class="progress"><i class="on"></i><i class="${stage!=='start'?'on':''}"></i><i class="${stage==='final'||stage==='reveal'?'on':''}"></i></div>${body}`}
function start(){stage='start';shell('THE SECRET WEEKEND',`<h1>下一站，未知。</h1><p class="sub">七個神秘目的地，一趟兩天一夜的冒險。<br>不看地名，只憑直覺，選出我們的週末。</p><div style="font-size:88px;margin:35px 0">🧭 🎲 🗺️</div><div class="actions"><button class="primary" onclick="round1()">開始冒險 →</button></div><p class="foot">台北出發 · 11/14 傍晚至 11/15 晚間 · 最後才揭曉目的地</p>`)}
function venn(labels,callback){return `<div class="venn"><div class="circle c1">${labels[0]}</div><div class="circle c2">${labels[1]}</div><div class="circle c3">${labels[2]}</div><button class="hit h12" onclick="${callback}('01')">選左＋右 ↗</button><button class="hit h13" onclick="${callback}('02')">選左＋下 ↙</button><button class="hit h23" onclick="${callback}('12')">選右＋下 ↘</button></div>`}
function round1(){stage='first';shell('LEVEL 01 · 選擇世界',`<h2>你想走進哪種風景？</h2><p class="sub">點選兩個圓圈的交集，選出最想要的兩種旅行環境。</p>${venn(['🥾 山林','🌊 海岸','♨️ 溫泉'],'chooseFirst')}<div class="actions"><button class="ghost" onclick="start()">← 回首頁</button></div>`)}
function chooseFirst(k){path=({'01':'ms','02':'mh','12':'sh'})[k];candidates=[...first[path]];if(path==='sh')finalRound(['jiaoxi','jinshan']);else round2()}
function round2(){stage='second';let q=questions[path];shell('LEVEL 02 · 解鎖活動',`<h2>接下來，想玩什麼？</h2><p class="sub">這一輪選的是具體體驗，不再重複選旅行環境。請再選兩項。</p>${venn(q.labels,'chooseSecond')}<div class="actions"><button class="ghost" onclick="round1()">← 重選旅行風格</button></div>`)}
function chooseSecond(k){const next=finalChoice[path][k];if(next.length===1)reveal(next[0]);else finalRound(next)}
const descriptions={jiaoxi:['溫泉＋海岸','山海風景與泡湯結合，旅程較有度假感'],beitou:['草原＋地熱','山景步道與地熱溫泉的組合'],wulai:['森林＋瀑布','瀑布、山谷與老街的慢步調'],keelung:['海景特色騎乘','鐵道自行車與海岸景觀'],jiufen:['山城＋登高','山城文化與登高遠眺海景'],jinshan:['奇岩＋濱海步道','奇岩地貌、海景與溫泉'],tamsui:['自由河岸騎乘','一般自行車、河口與觀音山景色']};
function finalRound(ids){stage='final';candidates=ids;let cards=ids.map((id,i)=>`<button class="choice" onclick="reveal('${id}')"><span class="tag">神秘路線 ${String.fromCharCode(65+i)}</span><strong>${descriptions[id][0]}</strong><small>${descriptions[id][1]}</small><div style="margin-top:16px;color:#f6c985">選這條路線 ↗</div></button>`).join('');shell('FINAL LEVEL · 命運決選',`<h2>最後一道選擇</h2><p class="sub">剩下 ${ids.length} 種都符合你的喜好。選一個最心動的旅行體驗，目的地就會揭曉。</p><div class="choices">${cards}</div><div class="actions"><button class="ghost" onclick="${path==='sh'?'round1()':'round2()'}">← 返回上一輪</button></div>`)}
function reveal(id){stage='reveal';let p=places[id];shell('DESTINATION UNLOCKED ✦',`<h1>你的神秘目的地是……</h1><div class="reveal"><div style="font-size:70px">${p.emoji}</div><h2>${p.name}</h2><p class="sub">${p.desc}</p><div>${p.tags.map(t=>`<span class="pill">${t}</span>`).join('')}</div></div><p class="sub">🎉 盲選完成！接下來才需要研究住宿、交通與詳細行程。</p><div class="actions"><button class="primary" onclick="start()">再玩一次 ↻</button><button class="ghost" onclick="navigator.clipboard?.writeText('旅行盲選結果：${p.name}')">複製結果</button></div><p class="foot">提醒：活動、營運與天候需出發前確認。深澳鐵道自行車不是一般自行車；飛行傘未列為必須完成的體驗。</p>`)}
start();
</script></body></html>
